# Manually-triggered release pipeline:
#   1. Build the operator binary + image for linux/amd64.
#   2. Push the image to GHCR as both :<version> and :latest.
#   3. Package charts/dbos-operator (chart version <version> without the v,
#      appVersion <version>) and push it to oci://ghcr.io/dbos-inc/charts.
#   4. Render install.yaml from the chart with the image pinned to :<version>,
#      and attach it to a GitHub release.
#
# Trigger: Actions → Release → Run workflow, supplying the version (e.g. v0.1.0).
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.1.0). Must start with v.'
        required: true
        type: string

permissions: {}

jobs:
  release:
    name: Build, push, and release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
      packages: write   # push to ghcr.io
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Validate version input
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "version must be vMAJOR.MINOR.PATCH (optionally with a -suffix); got '${{ inputs.version }}'" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Build operator binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags="-s -w" -o bin/operator ./cmd/operator

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build --platform linux/amd64 \
            -t "$IMAGE:${{ inputs.version }}" \
            -t "$IMAGE:latest" \
            .
          docker push "$IMAGE:${{ inputs.version }}"
          docker push "$IMAGE:latest"

      - name: Log in Helm to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Package and push Helm chart
        env:
          VERSION: ${{ inputs.version }}
        run: |
          helm package charts/dbos-operator --version "${VERSION#v}" --app-version "$VERSION"
          helm push "dbos-operator-${VERSION#v}.tgz" oci://ghcr.io/dbos-inc/charts

      - name: Render install.yaml from the chart, pinned to ${{ inputs.version }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "# Generated by the release workflow: helm template charts/dbos-operator."
            echo "# One fixed rendering — namespace dbos-operator, orgName CHANGEME. After"
            echo "# applying: edit the dbos-operator ConfigMap and create the dbos-conductor-license-key"
            echo "# secret. For a configurable install, use the Helm chart instead:"
            echo "#   helm install dbos-operator oci://ghcr.io/dbos-inc/charts/dbos-operator --version ${VERSION#v}"
            echo "---"
            echo "apiVersion: v1"
            echo "kind: Namespace"
            echo "metadata:"
            echo "  name: dbos-operator"
            helm template dbos-operator charts/dbos-operator \
              --namespace dbos-operator \
              --set config.orgName=CHANGEME \
              --set-string image.tag="$VERSION"
          } > install.yaml

      - name: Create GitHub release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          generate_release_notes: true
          files: install.yaml
