# The operator reads DBOSApplications, writes their status, and owns the
# Deployments and template-snapshot ControllerRevisions derived from them.
# Cluster-scoped so a single operator can watch every namespace; set
# config.watchNamespace to narrow behavior.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dbos-operator.fullname" . }}
  labels:
    {{- include "dbos-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["dbos.dev"]
    resources: ["dbosapplications"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["dbos.dev"]
    resources: ["dbosapplications/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "patch", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["controllerrevisions"]
    verbs: ["get", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dbos-operator.fullname" . }}
  labels:
    {{- include "dbos-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "dbos-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "dbos-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
