{{- if .Values.crds.install }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dbosapplications.dbos.dev
  annotations:
    # Survive helm uninstall so DBOSApplications are not cascaded away.
    helm.sh/resource-policy: keep
  labels:
    {{- include "dbos-operator.labels" . | nindent 4 }}
spec:
  group: dbos.dev
  scope: Namespaced
  names:
    kind: DBOSApplication
    listKind: DBOSApplicationList
    plural: dbosapplications
    singular: dbosapplication
    shortNames: [dbosapp]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Desired
          type: integer
          jsonPath: .status.desiredExecutors
          description: Executors the app's queue backlog currently needs
        - name: Polled
          type: string
          jsonPath: .status.lastPolledAt
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [template]
              # Beyond the fields documented below, any Deployment.spec field
              # except replicas (autoscaler-owned) and selector
              # (operator-owned) — strategy, minReadySeconds,
              # progressDeadlineSeconds, ... — is accepted and passed through
              # verbatim to the app's main Deployment. Unknown fields are not
              # validated here; a bogus field surfaces as an apply error in
              # the operator log.
              x-kubernetes-preserve-unknown-fields: true
              properties:
                appName:
                  type: string
                  description: >-
                    Conductor application name. Defaults to metadata.name.
                template:
                  description: >-
                    Pod template for the app, exactly as in
                    Deployment.spec.template. The operator wraps it in a
                    Deployment it owns (selector app=<name> is injected into
                    the template labels). spec.replicas is intentionally not
                    configurable: scaling belongs to the autoscaler pointed at
                    the operator's metrics endpoint.
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                desiredExecutors:
                  type: integer
                  description: >-
                    0 when the app has no autoscaling policy installed —
                    Conductor floors real recommendations at 1.
                noPolicy:
                  type: boolean
                  description: >-
                    True when Conductor reports no autoscaling policy for the
                    app; the metrics endpoint 404s and the HPA holds replicas.
                observedAt:
                  type: integer
                  format: int64
                  description: Epoch ms the underlying queue aggregate was computed.
                lastPolledAt:
                  type: string
{{- end }}
