apiVersion: v1
kind: Service
metadata:
  name: conductor
  namespace: dbos-conductor
spec:
  selector:
    app: conductor
  ports:
    - port: 8090
      targetPort: 8090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conductor
  namespace: dbos-conductor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: conductor
  template:
    metadata:
      labels:
        app: conductor
    spec:
      containers:
        - name: conductor
          image: 500883621673.dkr.ecr.us-east-1.amazonaws.com/dbos-conductor:latest
          imagePullPolicy: Always
          env:
            - name: DBOS__CONDUCTOR_DB_URL
              value: postgresql://postgres:dbos@postgres:5432/dbos_conductor?sslmode=disable
            - name: DBOS_OAUTH_ENABLED
              value: "false"
            - name: DBOS_CONDUCTOR_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: conductor-secrets
                  key: license-key
          ports:
            - containerPort: 8090
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
