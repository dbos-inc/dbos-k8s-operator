# Default install overlay: CRD, RBAC, and the manager. No cert-manager and no
# APIService — the operator serves plain HTTP inside the cluster; KEDA (or any
# metrics-api consumer) polls it directly.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../crd
  - ../manager
  - ../rbac
