# Registers the operator as the backing service for the External Metrics API.
# kube-apiserver routes /apis/external.metrics.k8s.io/v1beta1/* to dbos-operator.
#
# spec.caBundle must be set to the base64 of the CA cert that signed the
# operator's serving cert.
#  - cert-manager path: the cainjector annotation populates caBundle automatically
#    when config/cert-manager/certificate.yaml has been applied.
#  - self-signed path: replace caBundle: "" with the output of
#    `base64 -w0 < hack/certs/ca.crt`. The Makefile target
#    `make deploy-self-signed-apiservice` does this for you.
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1beta1.external.metrics.k8s.io
  annotations:
    cert-manager.io/inject-ca-from: dbos-operator/dbos-operator-serving-cert
spec:
  group: external.metrics.k8s.io
  groupPriorityMinimum: 100
  versionPriority: 100
  version: v1beta1
  service:
    name: dbos-operator
    namespace: dbos-operator
    port: 443
  caBundle: ""
