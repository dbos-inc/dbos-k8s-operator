apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dbos-operator
# configmap.yaml is intentionally NOT included. The default values
# (orgName, endpoint, app names) are placeholders that only fit one
# installation; shipping them would either be wrong or actively misleading.
# Users apply config/manager/configmap.yaml after editing it for their
# environment — see the README "Install" section. The Deployment will keep
# its pod in ContainerCreating until the `dbos-operator` ConfigMap exists.
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
