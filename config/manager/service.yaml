apiVersion: v1
kind: Service
metadata:
  name: dbos-operator
  namespace: dbos-operator
  labels:
    app.kubernetes.io/name: dbos-operator
spec:
  selector:
    app.kubernetes.io/name: dbos-operator
  ports:
    # Aggregated External Metrics API. kube-apiserver targets 443; we serve on 6443.
    - name: metrics-api
      port: 443
      targetPort: metrics-api
      protocol: TCP
