apiVersion: v1
kind: Service
metadata:
  name: dbos-operator
  namespace: dbos-operator
  labels:
    app.kubernetes.io/name: dbos-operator
spec:
  selector:
    app.kubernetes.io/name: dbos-operator
  ports:
    # Plain-HTTP metrics endpoint. KEDA ScaledObjects point their metrics-api
    # trigger at http://dbos-operator.dbos-operator.svc.cluster.local:8080/apps/<app>/autoscale
    - name: metrics
      port: 8080
      targetPort: metrics
      protocol: TCP
