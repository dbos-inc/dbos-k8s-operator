apiVersion: v1
kind: ConfigMap
metadata:
  name: dbos-operator
  namespace: dbos-operator
data:
  config.yaml: |
    # DBOS Kubernetes Operator config. Mounted into the pod at /etc/dbos-operator/config.yaml.
    conductor:
      orgName: local
      jwtPath: /var/run/secrets/conductor/token
      endpoint: http://conductor.dbos-conductor.svc.cluster.local:8090
    poller:
      interval: 1s
      maxBackoff: 30s
    versionManager:
      enabled: true
      interval: 30s
      # createArchives flips the version manager from log-only to actually
      # creating/deleting sibling Deployments for old versions with pending
      # workflows. Disable to revert to observation mode.
      createArchives: true
    apps:
      # app names must match K8s Deployment name
      - name: dbos-k8s-app
        namespace: dbos-demo
    metricsAPI:
      enabled: true
