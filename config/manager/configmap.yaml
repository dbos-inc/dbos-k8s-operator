apiVersion: v1
kind: ConfigMap
metadata:
  name: dbos-operator
  namespace: dbos-operator
data:
  config.yaml: |
    # DBOS Kubernetes Operator config. Mounted into the pod at /etc/dbos-operator/config.yaml.
    # Apps are NOT listed here: create DBOSApplication resources instead.
    conductor:
      orgName: max
      # endpoint: http://conductor.dbos-conductor.svc.cluster.local:8090
    poller:
      # Poll cadence per app. Defaults to 30s (KEDA's default polling
      # frequency); set lower when the consumer polls faster.
      interval: 5s
      maxBackoff: 30s
    http:
      listen: ":8080"
    kubernetes:
      # Namespace to watch for DBOSApplications; empty means all namespaces.
      namespace: ""
      reconcileInterval: 10s
