# Lets the External Metrics API server delegate authentication and
# authorization decisions to kube-apiserver. Required for any aggregated API.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dbos-operator-system-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: dbos-operator
    namespace: dbos-operator
