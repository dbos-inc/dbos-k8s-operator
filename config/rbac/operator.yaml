# The operator reads DBOSApplications, writes their status, and owns the
# Deployments derived from them. Cluster-scoped so a single operator can watch
# every namespace; scope the config's kubernetes.namespace to narrow behavior.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dbos-operator
rules:
  - apiGroups: ["dbos.dev"]
    resources: ["dbosapplications"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["dbos.dev"]
    resources: ["dbosapplications/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    # delete: an old application version's Deployment is torn down once
    # Conductor stops reporting that version.
    verbs: ["get", "list", "create", "patch", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["controllerrevisions"]
    # Template snapshots: one per distinct pod template, created at rollout so
    # old versions scale up on the template they actually ran. delete: only to
    # replace a snapshot when an author-pinned version changes template.
    verbs: ["get", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dbos-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dbos-operator
subjects:
  - kind: ServiceAccount
    name: dbos-operator
    namespace: dbos-operator
